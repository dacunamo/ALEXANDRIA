<!DOCTYPE html>
<html lang="es">

<head>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexandria - Iniciar sesión</title>
  <link rel="stylesheet" href="./src/web/welcome.css">
  <link rel="icon" type="image/x-icon" href="/src/imgs/sol_acuario.ico">
</head>

<body>
  <div class="main">
    <div class="logo-container">
      <a href="/"><img src="src/imgs/logo.png" class="logo-img" alt="Alexandria Logo"></a>
    </div>
  </div>

  <div class="main-container fade-in">
    <h1>Iniciar sesión</h1>

    <form id="login-form" class="auth-form">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div>
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar contraseña">👁</button>
        </div>
      </div>
      <div class="auth-error" id="error"></div>
      <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="auth-divider">o</div>

    <a class="google-btn" href="/api/auth/google">Continuar con Google</a>

    <div class="auth-switch">
      ¿No tienes cuenta? <a href="/register">Regístrate</a>
    </div>
  </div>

  <footer class="main-footer">
    <p>Desarrollado con mucho cariño por Dacunamo.</p>
  </footer>

  <script src="./src/web/passwordToggle.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const result = await res.json();

        if (res.ok && result.success) {
          window.location.href = "/mi-espacio";
        } else {
          errorEl.textContent = result.error || "No se pudo iniciar sesión";
        }
      } catch (err) {
        errorEl.textContent = "Error de red: " + err.message;
      }
    });
  </script>
</body>

</html>
